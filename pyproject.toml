# tools on its own: the tooling the tests and the scripts run with.  No distribution lives here -- src/ is one colcon
# workspace of ROS packages, and the tests import the scripts beside them through tests/conftest.py.  `uv sync && uv run ruff check . && uv run pytest` in a fresh clone is the whole check.

[project]
name = "tools"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.5,<0.17",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
